[package]
name = "uupdump-client"
version = "0.1.0"
edition = "2021"
description = "Client natif léger pour UUP dump : recherche de builds Windows, configuration du package, intégration de drivers, création d'ISO"
license = "MIT"

[dependencies]
eframe = "0.31"
ureq = { version = "2.10", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"

[profile.release]
opt-level = 2
strip = true
codegen-units = 1
