[package]
name = "uupdump-client"
version = "0.1.0"
edition = "2021"
description = "Client natif léger pour UUP dump : recherche de builds Windows, téléchargement des fichiers UUP, ajout de drivers et création d'ISO"
license = "MIT"

[dependencies]
eframe = "0.33"
ureq = { version = "2", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
sha1 = "0.10"
sha2 = "0.10"
dirs = "5"
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
